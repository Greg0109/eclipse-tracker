default:
  service:
    app_name: Eclipse Tracker development
    activity_id_http_header: X-Request-Id
    tenant_header: ""
    secret: # define secrets as env var always
  
  logging:
    log_level: DEBUG
    log_format: console-simple
    log_handler: stdout

  cors:
    allow_origins:
      - "http://localhost:5173"
      - "http://127.0.0.1:5173"

  external_apis:
    elevation_url: "https://api.open-elevation.com/api/v1/lookup"
    # Tried in order, fastest-when-healthy first. Measured from this machine: overpass-api.de is the
    # quickest when it connects but its DNS/TLS is intermittently unreachable here (fails in <0.1s,
    # so trying it first is nearly free); maps.mail.ru is the reliable middle ground; kumi.systems
    # works but was repeatedly 45-80s per query, so it is the last resort.
    overpass_urls:
      - "https://overpass-api.de/api/interpreter"
      - "https://maps.mail.ru/osm/tools/overpass/api/interpreter"
      - "https://overpass.kumi.systems/api/interpreter"
    nominatim_url: "https://nominatim.openstreetmap.org"
    user_agent: "eclipse-tracker/0.1 (https://github.com/greg0109/eclipse_tracker)"
    request_timeout_s: 70.0 # must cover the viewpoint query's "[timeout:55]" plus mirror latency
    cache_ttl_s: 3600
    # Public Overpass instances allocate ~2 slots per client and answer the rest with 429 (or a
    # 200 HTML error page). Going wider makes a request slower, not faster.
    max_concurrent_overpass_requests: 2
    # Point-radius lookups folded into a single batched "out count;" query.
    overpass_batch_size: 15
    # How long a mirror gets to answer before the next one is raced alongside it.
    overpass_hedge_delay_s: 10.0

  scoring:
    weights:
      duration: 0.30
      distance: 0.15
      viewing_angle: 0.25
      beauty: 0.20
      accessibility: 0.10
    candidate_search_radius_m: 3000
    terrain_ray_samples: 8
    terrain_ray_max_km: 5.0

test: &test
  service.app_name: Eclipse Tracker test
  logging:
    log_level: INFO
    log_format: console-simple
    log_handler: stdout

docker-dev:
  <<: *test

prod:
  service.app_name: Eclipse Tracker
  logging:
    log_level: INFO
    log_format: json
    log_handler: stdout

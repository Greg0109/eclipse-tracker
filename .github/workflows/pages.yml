name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages, but nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; skip superseded queued runs rather than deploying stale builds.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      # lfs: images/fonts are stored in Git LFS; without this the checkout yields pointer stubs
      # and the site ships a text file where the favicon should be.
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx oxlint .
      - run: npm run build
        env:
          # Project site lives under /eclipse-tracker/.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # No backend is deployed with the static site. Point this at a reachable API to enable
          # the recommendation and itinerary features; the map and eclipse path work regardless.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
